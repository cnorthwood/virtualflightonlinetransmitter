apiVersion: v1
kind: Service
metadata:
  name: {{ include "virtualflightonlinetransmitter.fullname" . }}
  labels:
    {{- include "virtualflightonlinetransmitter.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "virtualflightonlinetransmitter.selectorLabels" . | nindent 4 }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "virtualflightonlinetransmitter.fullname" . }}
  labels:
    {{- include "virtualflightonlinetransmitter.labels" . | nindent 4 }}
  annotations:
    {{- with .Values.ingress.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  rules:
    - host: {{ .Values.ingress.hostname }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "virtualflightonlinetransmitter.fullname" . }}
                port:
                  name: http
  tls:
    {{- with .Values.ingress.tls }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
{{- if .Capabilities.APIVersions.Has "traefik.io/v1alpha1" }}
---
# Hides the APCu manager from the web. This is a router for just that path,
# which wins over the Ingress because of its higher priority, and a middleware
# that only lets in requests from 127.0.0.1, so everyone else gets a 403. It
# uses only Traefik's built-in features: a plugin would be downloaded each time
# Traefik starts, and if that fails Traefik drops every route that uses it
# (omelette-gay/coven#141).
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: {{ include "virtualflightonlinetransmitter.fullname" . }}-deny-all
  labels:
    {{- include "virtualflightonlinetransmitter.labels" . | nindent 4 }}
spec:
  ipAllowList:
    sourceRange:
      - 127.0.0.1/32
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: {{ include "virtualflightonlinetransmitter.fullname" . }}-block-apcu-manager
  labels:
    {{- include "virtualflightonlinetransmitter.labels" . | nindent 4 }}
spec:
  entryPoints:
    - {{ if .Values.ingress.tls }}websecure{{ else }}web{{ end }}
  routes:
    - kind: Rule
      match: Host(`{{ .Values.ingress.hostname }}`) && PathPrefix(`/apcu_manager`)
      priority: 10000
      middlewares:
        - name: {{ include "virtualflightonlinetransmitter.fullname" . }}-deny-all
      services:
        - kind: TraefikService
          name: noop@internal
  {{- with .Values.ingress.tls }}
  tls:
    secretName: {{ (first .).secretName }}
  {{- end }}
{{- end }}
